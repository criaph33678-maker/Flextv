<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Flex TV Player</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flex TV">
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      background: linear-gradient(180deg, #181c24 0%, #0d0f12 100%);
    }

    .login-card {
      background: #181b22;
      border: 1px solid #2a2e39;
      padding: 25px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .login-card h2 {
      margin-bottom: 15px;
      color: #0084ff;
      font-size: 22px;
    }

    .input-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .input-group input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2f3442;
      background: #0f1115;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .file-input {
      margin-top: 8px;
      font-size: 12px;
      color: #aaa;
    }

    .divider {
      margin: 15px 0;
      color: #555;
      font-size: 12px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0084ff;
      color: #fff;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .app-container {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 10px 15px;
      background: #181b22;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232733;
    }

    header h1 { font-size: 18px; color: #0084ff; }

    .btn-logout {
      background: #2f3442;
      border: none;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .player-section { background: #000; width: 100%; }
    video { width: 100%; max-height: 30vh; display: block; }

    .nav-tabs {
      display: flex;
      background: #14171d;
      border-bottom: 1px solid #232733;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      color: #888;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .tab-btn.active {
      color: #0084ff;
      border-bottom-color: #0084ff;
      background: #181b22;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .channel-item {
      padding: 12px;
      background: #181b22;
      margin-bottom: 6px;
      border-radius: 6px;
      border: 1px solid #232733;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .channel-item:active { background: #0084ff; color: #fff; }
    .badge {
      font-size: 10px;
      background: #2f3442;
      padding: 2px 6px;
      border-radius: 4px;
      color: #aaa;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- TELA DE ENTRADA -->
  <div class="login-container" id="loginScreen">
    <div class="login-card">
      <h2>FLEX TV WEB</h2>
      
      <div class="input-group">
        <label>Cole a URL da Lista M3U (HTTPS)</label>
        <input type="text" id="m3uUrlInput" placeholder="https://servidor.com/lista.m3u">
      </div>
      <button class="btn-login" onclick="startAppFromUrl()">CARREGAR POR LINK</button>

      <div class="divider">── OU ──</div>

      <div class="input-group">
        <label>Carregar Ficheiro .m3u do dispositivo</label>
        <input type="file" id="m3uFileInput" accept=".m3u, .m3u8, text/plain" class="file-input" onchange="startAppFromFile(event)">
      </div>
    </div>
  </div>

  <!-- INTERFACE PRINCIPAL -->
  <div class="app-container" id="appScreen">
    <header>
      <h1>Flex TV</h1>
      <button class="btn-logout" onclick="logout()">Trocar Lista</button>
    </header>

    <div class="player-section">
      <video id="videoPlayer" controls autoplay></video>
    </div>

    <!-- ABAS -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabLive" onclick="switchTab('live')">📺 CANAIS</button>
      <button class="tab-btn" id="tabMovie" onclick="switchTab('movie')">🎬 FILMES</button>
      <button class="tab-btn" id="tabSeries" onclick="switchTab('series')">🍿 SÉRIES</button>
    </div>

    <div class="content-area" id="itemList"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const video = document.getElementById('videoPlayer');
    let hls = new Hls();
    let allItems = { live: [], movie: [], series: [] };
    let currentType = 'live';

    async function fetchM3U(targetUrl) {
      const proxies = [
        targetUrl,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
      ];

      for (const url of proxies) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            const text = await res.text();
            if (text && (text.includes('#EXTM3U') || text.includes('#EXTINF'))) {
              return text;
            }
          }
        } catch (e) {}
      }
      throw new Error('Bloqueio de CORS ou servidor sem suporte a HTTPS.');
    }

    async function startAppFromUrl() {
      const url = document.getElementById('m3uUrlInput').value.trim();
      if (!url) return alert('Insira a URL M3U!');

      localStorage.setItem('flex_m3u_url', url);
      showAppScreen();

      const listContainer = document.getElementById('itemList');
      listContainer.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">A carregar lista...</p>';

      try {
        const text = await fetchM3U(url);
        parseM3U(text);
        renderCurrentList();
      } catch (err) {
        alert('Erro ao carregar lista: ' + err.message + '\n\nSugestão: Descarregue o ficheiro .m3u no dispositivo e use a opção de carregar ficheiro.');
        logout();
      }
    }

    function startAppFromFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      showAppScreen();

      reader.onload = function(e) {
        const text = e.target.result;
        parseM3U(text);
        renderCurrentList();
      };
      reader.readAsText(file);
    }

    function showAppScreen() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'flex';
    }

    function logout() {
      localStorage.removeItem('flex_m3u_url');
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      if (hls) hls.destroy();
    }

    function parseM3U(m3uContent) {
      allItems = { live: [], movie: [], series: [] };
      const lines = m3uContent.split(/\r?\n/);

      let currentTitle = '';
      let currentGroup = '';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        if (line.startsWith('#EXTINF:')) {
          const groupMatch = line.match(/group-title="([^"]+)"/i);
          currentGroup = groupMatch ? groupMatch[1] : 'Geral';

          const commaIdx = line.lastIndexOf(',');
          currentTitle = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Sem nome';
        } else if (line.length > 0 && !line.startsWith('#')) {
          const itemUrl = line;
          const grp = currentGroup.toLowerCase();
          const url = itemUrl.toLowerCase();

          const item = { title: currentTitle || 'Sem Nome', group: currentGroup, url: itemUrl };

          if (grp.includes('filme') || grp.includes('movie') || grp.includes('vod') || url.includes('/movie/')) {
            allItems.movie.push(item);
          } else if (grp.includes('série') || grp.includes('serie') || grp.includes('series') || url.includes('/series/')) {
            allItems.series.push(item);
          } else {
            allItems.live.push(item);
          }

          currentTitle = '';
          currentGroup = '';
        }
      }

      document.getElementById('tabLive').innerText = `📺 CANAIS (${allItems.live.length})`;
      document.getElementById('tabMovie').innerText = `🎬 FILMES (${allItems.movie.length})`;
      document.getElementById('tabSeries').innerText = `🍿 SÉRIES (${allItems.series.length})`;
    }

    function switchTab(type) {
      currentType = type;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      if (type === 'live') document.getElementById('tabLive').classList.add('active');
      if (type === 'movie') document.getElementById('tabMovie').classList.add('active');
      if (type === 'series') document.getElementById('tabSeries').classList.add('active');

      renderCurrentList();
    }

    function renderCurrentList() {
      const listContainer = document.getElementById('itemList');
      listContainer.innerHTML = '';

      const items = allItems[currentType] || [];

      if (items.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Nenhum item encontrado nesta categoria.</p>';
        return;
      }

      const limit = Math.min(items.length, 300);
      for (let i = 0; i < limit; i++) {
        const item = items[i];
        const div = document.createElement('div');
        div.className = 'channel-item';
        div.innerHTML = `
          <span>${item.title}</span>
          ${item.group ? `<span class="badge">${item.group}</span>` : ''}
        `;
        div.onclick = () => playStream(item.url);
        listContainer.appendChild(div);
      }
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    window.onload = () => {
      const savedUrl = localStorage.getItem('flex_m3u_url');
      if (savedUrl) {
        document.getElementById('m3uUrlInput').value = savedUrl;
        startAppFromUrl();
      }
    };
  </script>
</body>
</html>
