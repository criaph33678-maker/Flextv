<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Meu IPTV</title>

  <!-- Configurações PWA para iOS (Remove barras de navegação) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meu IPTV">
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      padding: 15px;
      background: #1e1e1e;
      text-align: center;
      font-weight: bold;
    }
    .input-section {
      padding: 10px;
      display: flex;
      gap: 8px;
      background: #181818;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      background: #e50914;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    .player-container {
      width: 100%;
      background: #000;
    }
    video {
      width: 100%;
      max-height: 40vh;
      display: block;
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .channel-item {
      padding: 12px;
      border-bottom: 1px solid #222;
      cursor: pointer;
    }
    .channel-item:hover { background: #222; }
  </style>
</head>
<body>

  <header>Meu IPTV Web Player</header>

  <div class="player-container">
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <div class="input-section">
    <input type="text" id="m3uUrl" placeholder="Cole o link da sua lista M3U aqui...">
    <button onclick="loadList()">Carregar</button>
  </div>

  <div class="channel-list" id="channelList">
    <p style="text-align: center; color: #888; margin-top: 20px;">Insira um link M3U acima para carregar os canais.</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const video = document.getElementById('videoPlayer');
    let hls = new Hls();

    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    async function loadList() {
      const url = document.getElementById('m3uUrl').value.trim();
      const listContainer = document.getElementById('channelList');
      if (!url) return alert('Por favor, informe a URL da lista M3U');

      listContainer.innerHTML = '<p style="text-align:center;">Carregando canais...</p>';

      try {
        const response = await fetch(url);
        const text = await response.text();
        const lines = text.split('\n');
        
        listContainer.innerHTML = '';
        let currentTitle = '';

        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const parts = line.split(',');
            currentTitle = parts[parts.length - 1];
          } else if (line.startsWith('http')) {
            const channelUrl = line;
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerText = currentTitle || 'Canal Sem Nome';
            item.onclick = () => playStream(channelUrl);
            listContainer.appendChild(item);
            currentTitle = '';
          }
        });
      } catch (err) {
        alert('Erro ao carregar lista. Verifique a URL.');
        listContainer.innerHTML = '';
      }
    }
  </script>
</body>
</html>
