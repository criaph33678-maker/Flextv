<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Flex TV Player</title>

  <!-- Configurações PWA para iOS (Remove barras do Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flex TV">
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ECRÃ DE LOGIN */
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      background: linear-gradient(180deg, #181c24 0%, #0d0f12 100%);
    }

    .login-card {
      background: #181b22;
      border: 1px solid #2a2e39;
      padding: 30px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .login-card h2 {
      margin-bottom: 20px;
      color: #0084ff;
      font-size: 24px;
      letter-spacing: 1px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2f3442;
      background: #0f1115;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #0084ff;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0084ff;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-login:active {
      background: #0066cc;
    }

    /* INTERFACE DO PLAYER */
    .app-container {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 12px 15px;
      background: #181b22;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232733;
    }

    header h1 {
      font-size: 18px;
      color: #0084ff;
    }

    .btn-logout {
      background: #2f3442;
      border: none;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .player-section {
      background: #000;
      width: 100%;
    }

    video {
      width: 100%;
      max-height: 35vh;
      display: block;
    }

    .channels-section {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .channel-item {
      padding: 14px;
      background: #181b22;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #232733;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .channel-item:active {
      background: #0084ff;
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div class="login-container" id="loginScreen">
    <div class="login-card">
      <h2>FLEX TV WEB</h2>
      <div class="input-group">
        <label>DNS / Servidor</label>
        <input type="text" id="serverHost" placeholder="http://meuservidor.com:8080">
      </div>
      <div class="input-group">
        <label>Usuário</label>
        <input type="text" id="username" placeholder="Seu usuário">
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Sua senha">
      </div>
      <button class="btn-login" onclick="login()">ENTRAR</button>
    </div>
  </div>

  <!-- INTERFACE DO PLAYER -->
  <div class="app-container" id="appScreen">
    <header>
      <h1>Flex TV</h1>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </header>

    <div class="player-section">
      <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="channels-section" id="channelList">
      <!-- Canais inseridos via JS -->
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const video = document.getElementById('videoPlayer');
    let hls = new Hls();

    window.onload = () => {
      const savedHost = localStorage.getItem('iptv_host');
      const savedUser = localStorage.getItem('iptv_user');
      const savedPass = localStorage.getItem('iptv_pass');

      if (savedHost && savedUser && savedPass) {
        document.getElementById('serverHost').value = savedHost;
        document.getElementById('username').value = savedUser;
        document.getElementById('password').value = savedPass;
        login();
      }
    };

    async function login() {
      let host = document.getElementById('serverHost').value.trim();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!host || !user || !pass) {
        return alert('Preencha todos os campos!');
      }

      if (host.endsWith('/')) host = host.slice(0, -1);

      localStorage.setItem('iptv_host', host);
      localStorage.setItem('iptv_user', user);
      localStorage.setItem('iptv_pass', pass);

      const m3uUrl = `${host}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=ts`;

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'flex';

      loadChannels(m3uUrl);
    }

    function logout() {
      localStorage.clear();
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      if (hls) hls.destroy();
    }

    async function loadChannels(url) {
      const listContainer = document.getElementById('channelList');
      listContainer.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Carregando canais...</p>';

      // Utilizando o proxy CORS para contornar o bloqueio de navegador
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);

      try {
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Erro na requisição');
        
        const text = await response.text();
        const lines = text.split('\n');

        listContainer.innerHTML = '';
        let currentTitle = '';

        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const parts = line.split(',');
            currentTitle = parts[parts.length - 1];
          } else if (line.startsWith('http')) {
            const channelUrl = line;
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerHTML = `<span>${currentTitle || 'Canal'}</span> ▶`;
            item.onclick = () => playStream(channelUrl);
            listContainer.appendChild(item);
            currentTitle = '';
          }
        });
      } catch (err) {
        alert('Erro ao conectar ao servidor. Verifique o usuário, senha ou o endereço do DNS.');
        logout();
      }
    }

    function playStream(url) {
      // Passa a URL do fluxo pelo proxy para liberar a reprodução do canal
      const proxyStreamUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(proxyStreamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = proxyStreamUrl;
        video.play();
      }
    }
  </script>
</body>
</html>
