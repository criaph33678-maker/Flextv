<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #151921;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232936;
    }

    header h1 { font-size: 20px; color: #0084ff; }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      background: #11141c;
      border-right: 1px solid #232936;
      display: flex;
      flex-direction: column;
    }

    .tabs {
      display: flex;
      background: #151921;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      color: #888;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .tab-btn.active {
      color: #0084ff;
      border-bottom-color: #0084ff;
      background: #11141c;
    }

    .content-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .item {
      padding: 12px;
      background: #151921;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #232936;
    }

    .item:hover {
      background: #0084ff;
      color: #fff;
    }

    .player-container {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Flex TV</h1>
  </header>

  <div class="main-layout">
    <!-- Menu Lateral Sem Barra de Pesquisa -->
    <div class="sidebar">
      <div class="tabs">
        <button class="tab-btn active">Canais</button>
        <button class="tab-btn">Filmes</button>
        <button class="tab-btn">Séries</button>
      </div>

      <!-- Lista Direta dos Conteúdos -->
      <div class="content-list">
        <div class="item">Canal 1</div>
        <div class="item">Canal 2</div>
        <div class="item">Canal 3</div>
      </div>
    </div>

    <!-- Área Principal / Player -->
    <div class="player-container">
      <p style="color: #555;">Selecione um item na lista ao lado para reproduzir.</p>
    </div>
  </div>

</body>
</html>
