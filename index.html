<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Web Player IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Tela de Login */
    .login-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      background: #151921;
      border: 1px solid #232936;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0084ff;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #a0a6b5;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #2d3446;
      background: #0b0e14;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0084ff;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    /* Tela Principal */
    .app-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #151921;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232936;
    }

    header h1 { font-size: 18px; color: #0084ff; }

    .btn-logout {
      background: #2d3446;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 320px;
      background: #11141c;
      border-right: 1px solid #232936;
      display: flex;
      flex-direction: column;
    }

    .tabs {
      display: flex;
      background: #151921;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 0;
      background: none;
      border: none;
      color: #888;
      font-weight: bold;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .tab-btn.active {
      color: #0084ff;
      border-bottom-color: #0084ff;
      background: #11141c;
    }

    .search-box {
      padding: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: #151921;
      border: 1px solid #232936;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }

    .stream-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .stream-item {
      padding: 10px 12px;
      background: #151921;
      margin-bottom: 6px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #232936;
    }

    .stream-item:hover {
      background: #0084ff;
      color: #fff;
    }

    .player-container {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-box" id="loginScreen">
    <div class="card">
      <h2>Web Player (Sem Anúncios)</h2>
      <div class="input-group">
        <label>URL do Servidor Xtream</label>
        <input type="text" id="serverUrl" placeholder="http://servidor.com:8080">
      </div>
      <div class="input-group">
        <label>Utilizador</label>
        <input type="text" id="username" placeholder="Seu utilizador">
      </div>
      <div class="input-group">
        <label>Palavra-passe</label>
        <input type="password" id="password" placeholder="Sua palavra-passe">
      </div>
      <button class="btn-submit" onclick="login()">ENTRAR</button>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="app-screen" id="appScreen">
    <header>
      <h1>Meu Web Player</h1>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </header>

    <div class="main-layout">
      <div class="sidebar">
        <div class="tabs">
          <button class="tab-btn active" id="tabLive" onclick="switchTab('live')">Canais</button>
          <button class="tab-btn" id="tabMovie" onclick="switchTab('movie')">Filmes</button>
          <button class="tab-btn" id="tabSeries" onclick="switchTab('series')">Séries</button>
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Pesquisar..." oninput="filterList()">
        </div>

        <div class="stream-list" id="streamList"></div>
      </div>

      <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
      </div>
    </div>
  </div>

  <script>
    let credentials = {};
    let currentCategory = 'live';
    let dataStore = { live: [], movie: [], series: [] };
    let hls = new Hls();

    async function login() {
      let server = document.getElementById('serverUrl').value.trim();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!server || !user || !pass) return alert('Preencha todos os campos!');

      if (server.endsWith('/')) server = server.slice(0, -1);
      credentials = { server, user, pass };

      try {
        await loadCategory('get_live_streams', 'live');
        await loadCategory('get_vod_streams', 'movie');
        await loadCategory('get_series', 'series');

        localStorage.setItem('iptv_creds', JSON.stringify(credentials));
        showApp();
        renderList();
      } catch (e) {
        alert('Erro ao autenticar ou ligar ao servidor Xtream.');
      }
    }

    async function loadCategory(action, key) {
      const url = `${credentials.server}/player_api.php?username=${credentials.user}&password=${credentials.pass}&action=${action}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      
      const res = await fetch(proxyUrl);
      dataStore[key] = await res.json();
    }

    function showApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'flex';
    }

    function logout() {
      localStorage.removeItem('iptv_creds');
      location.reload();
    }

    function switchTab(type) {
      currentCategory = type;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (type === 'live') document.getElementById('tabLive').classList.add('active');
      if (type === 'movie') document.getElementById('tabMovie').classList.add('active');
      if (type === 'series') document.getElementById('tabSeries').classList.add('active');
      renderList();
    }

    function renderList() {
      const container = document.getElementById('streamList');
      container.innerHTML = '';
      const items = dataStore[currentCategory] || [];
      const query = document.getElementById('searchInput').value.toLowerCase();

      const filtered = items.filter(i => (i.name || '').toLowerCase().includes(query)).slice(0, 150);

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'stream-item';
        div.innerText = item.name;
        div.onclick = () => playStream(item);
        container.appendChild(div);
      });
    }

    function filterList() {
      renderList();
    }

    function playStream(item) {
      const video = document.getElementById('videoPlayer');
      let streamUrl = '';

      if (currentCategory === 'live') {
        streamUrl = `${credentials.server}/live/${credentials.user}/${credentials.pass}/${item.stream_id}.m3u8`;
      } else if (currentCategory === 'movie') {
        streamUrl = `${credentials.server}/movie/${credentials.user}/${credentials.pass}/${item.stream_id}.${item.container_extension || 'mp4'}`;
      }

      const proxiedStream = `https://corsproxy.io/?${encodeURIComponent(streamUrl)}`;

      if (Hls.isSupported() && streamUrl.endsWith('.m3u8')) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(proxiedStream);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else {
        video.src = proxiedStream;
        video.play();
      }
    }

    window.onload = () => {
      const saved = localStorage.getItem('iptv_creds');
      if (saved) {
        credentials = JSON.parse(saved);
        document.getElementById('serverUrl').value = credentials.server;
        document.getElementById('username').value = credentials.user;
        document.getElementById('password').value = credentials.password;
        login();
      }
    };
  </script>
</body>
</html>
