<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Flex TV Player</title>

  <!-- Configurações PWA para iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flex TV">
  
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f12;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 20px;
      background: linear-gradient(180deg, #181c24 0%, #0d0f12 100%);
    }

    .login-card {
      background: #181b22;
      border: 1px solid #2a2e39;
      padding: 25px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .login-card h2 {
      margin-bottom: 15px;
      color: #0084ff;
      font-size: 22px;
    }

    .input-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2f3442;
      background: #0f1115;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #0084ff;
      color: #fff;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .app-container {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 12px 15px;
      background: #181b22;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #232733;
    }

    header h1 { font-size: 18px; color: #0084ff; }

    .btn-logout {
      background: #2f3442;
      border: none;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .player-section { background: #000; width: 100%; }
    video { width: 100%; max-height: 35vh; display: block; }

    .channels-section {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .channel-item {
      padding: 12px;
      background: #181b22;
      margin-bottom: 6px;
      border-radius: 6px;
      border: 1px solid #232733;
      font-size: 14px;
      cursor: pointer;
    }

    .channel-item:active { background: #0084ff; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div class="login-container" id="loginScreen">
    <div class="login-card">
      <h2>FLEX TV WEB</h2>
      <div class="input-group">
        <label>DNS / Servidor (URL com porta)</label>
        <input type="text" id="serverHost" placeholder="http://servidor.com:8080">
      </div>
      <div class="input-group">
        <label>Usuário</label>
        <input type="text" id="username" placeholder="Seu usuário">
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Sua senha">
      </div>
      <button class="btn-login" onclick="login()">ENTRAR</button>
    </div>
  </div>

  <!-- INTERFACE DO PLAYER -->
  <div class="app-container" id="appScreen">
    <header>
      <h1>Flex TV</h1>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </header>

    <div class="player-section">
      <video id="videoPlayer" controls autoplay></video>
    </div>

    <div class="channels-section" id="channelList"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const video = document.getElementById('videoPlayer');
    let hls = new Hls();

    // Lista de proxies de contingência
    const PROXIES = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => `https://thingproxy.freeboard.io/fetch/${url}`
    ];

    async function fetchWithFallback(targetUrl) {
      // Tenta conexão direta primeiro
      try {
        const directRes = await fetch(targetUrl);
        if (directRes.ok) return await directRes.text();
      } catch (e) {}

      // Tenta cada proxy da lista
      for (const proxyFn of PROXIES) {
        try {
          const res = await fetch(proxyFn(targetUrl));
          if (res.ok) {
            const text = await res.text();
            if (text && text.includes('#EXTM3U')) return text;
          }
        } catch (e) {}
      }
      throw new Error('Não foi possível conectar');
    }

    async function login() {
      let host = document.getElementById('serverHost').value.trim();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!host || !user || !pass) return alert('Preencha todos os campos!');

      if (host.endsWith('/')) host = host.slice(0, -1);
      if (!host.startsWith('http://') && !host.startsWith('https://')) {
        host = 'http://' + host;
      }

      const m3uUrl = `${host}/get.php?username=${user}&password=${pass}&type=m3u_plus&output=ts`;

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'flex';

      loadChannels(m3uUrl);
    }

    function logout() {
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      if (hls) hls.destroy();
    }

    async function loadChannels(m3uUrl) {
      const listContainer = document.getElementById('channelList');
      listContainer.innerHTML = '<p style="text-align:center; padding:20px; color:#888;">Carregando lista de canais...</p>';

      try {
        const text = await fetchWithFallback(m3uUrl);
        const lines = text.split('\n');

        listContainer.innerHTML = '';
        let currentTitle = '';

        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith('#EXTINF:')) {
            const parts = line.split(',');
            currentTitle = parts[parts.length - 1];
          } else if (line.startsWith('http')) {
            const channelUrl = line;
            const item = document.createElement('div');
            item.className = 'channel-item';
            item.innerHTML = `📺 ${currentTitle || 'Canal'}`;
            item.onclick = () => playStream(channelUrl);
            listContainer.appendChild(item);
            currentTitle = '';
          }
        });
      } catch (err) {
        alert('Erro de conexão com o servidor. Verifique se o DNS/Usuário/Senha estão corretos ou se o servidor requer SSL/HTTPS.');
        logout();
      }
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }
  </script>
</body>
</html>
